    padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  #app>:first-child{margin-top:auto}#app>:last-child{margin-bottom:auto}   /* центр по вертикали, но без обрезания, когда не помещается */
  canvas{display:block;flex:none;max-width:100%;height:min(calc(100vh - 170px),calc(100dvh - 170px),calc((100vw - 16px) * 76 / 54));aspect-ratio:9/16;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.6);background:#0b0f14}
  body:not(.record) canvas{aspect-ratio:54/76;object-fit:cover;object-position:50% 45%}   /* в живой версии обрезаем пустые поля сверху и снизу (кадр 1080x1920 остаётся прежним для роликов) */
  #ui{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(100%,420px)}

/* ---------- утилиты ---------- */
var hash=EN.hash,h01=EN.h01;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function smooth(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function fillRR(x,y,w,h,r,c){ctx.fillStyle=c;rr(x,y,w,h,r);ctx.fill();}
function fitText(str,weight,maxSize,maxW){var s=maxSize;ctx.font=weight+' '+s+'px '+FONT;var w=ctx.measureText(str).width;if(w>maxW){s=Math.floor(s*maxW/w);ctx.font=weight+' '+s+'px '+FONT;}return s;}
function poly(pts,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill();}
function money(n){n=Math.max(0,Math.round(n));return '$'+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function bigText(str,x,y,size,alpha,fill){ctx.save();ctx.globalAlpha=alpha;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='800 '+size+'px '+FONT;ctx.lineWidth=size*0.12;ctx.strokeStyle='#05070a';ctx.lineJoin='round';ctx.strokeText(str,x,y);ctx.fillStyle=fill||'#ffffff';ctx.fillText(str,x,y);ctx.restore();}

/* ---------- эпизоды ---------- */
var scene=null;
function episode(seed,e){
  var survive=EN.rekt.survives(seed,e);
  return {e:e,survive:survive,ob:survive?0:(h01(seed*31+2,e)<0.5?0:1),car:Math.floor(h01(seed*31+3,e)*CARS.length),
          cs:Math.floor(h01(seed*31+4,e)*4),cp:Math.floor(h01(seed*31+5,e)*4),n:scene.chad0+e};
}
/* дистанция прокрутки мира */
function sOf(t,surv){
  var s;
  if(t<1.2)s=29.17*t*t;
  else if(t<4)s=42+70*(t-1.2);
  else if(t<=7){var a=t-4;s=238+70*a+10*a*a;}
  else s=surv?538+130*(t-7):S_TI;
  return s;
}
function buildScene(seed,o){
  o=o||{};
  var r=mulberry32(((seed>>>0)^0x51ed270b)>>>0);
  var skin=(o.skin&&SKINS[o.skin])?o.skin:SKIN_NAMES[Math.floor(r()*SKIN_NAMES.length)];
  /* горизонт: два слоя зданий */
  function layer(pw,minw,maxw,minh,maxh,gap){var arr=[],x=0,i=0;while(x<pw-minw){var w=minw+r()*(maxw-minw),h=minh+r()*(maxh-minh);arr.push({x:x,w:w,h:h,i:i++});x+=w+r()*gap;}return arr;}
  var far=layer(1080,40,86,70,190,6),near=layer(720,50,110,40,112,10);
  var stars=[];for(var i=0;i<34;i++)stars.push([r()*540,SY+r()*150,0.5+r()*1.3,r()*6]);
  return {seed:seed|0,skin:skin,T0:o.T0||0,lang:TXT[o.lang]?o.lang:'en',bonus:(o.bonus&&String(o.bonus).slice(0,40))||BONUS,url:(o.url&&BRAND_RE.test(String(o.url)))?String(o.url):'coinplay.com',
          far:far,near:near,stars:stars,chad0:1000+((Math.abs(seed)*977)%4000)};
}

/* ---------- рисование: машина ---------- */
function drawCar(x,y,rot,color,o){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(K,K);
  if(o.beam){var g=ctx.createLinearGradient(66,0,230,0);g.addColorStop(0,'rgba(255,244,200,0.35)');g.addColorStop(1,'rgba(255,244,200,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(66,-9);ctx.lineTo(230,-34);ctx.lineTo(230,14);ctx.lineTo(66,-3);ctx.closePath();ctx.fill();}
  if(o.flame){var fl=16+9*Math.sin(o.t*45);poly([[-66,-6],[-66-fl,-3],[-66,0]],'#ff9f1a');poly([[-66,-5],[-66-fl*0.55,-3],[-66,-1]],'#fff2a8');}
  ctx.fillStyle='rgba(245,184,61,0.0)';
  /* подсветка днища */
  ctx.save();ctx.globalAlpha=0.5;ctx.fillStyle=o.glow;ctx.beginPath();ctx.ellipse(0,8,58,3.5,0,0,6.3);ctx.fill();ctx.restore();
  /* спойлер */
  fillRR(-71,-27,24,4,1.5,'#11151c');fillRR(-62,-25,3,12,1,'#11151c');
  /* корпус */
  poly([[-62,4],[-65,-8],[-48,-13],[-22,-16],[0,-26],[22,-26],[50,-10],[68,-6],[70,0],[64,4]],color);
  /* полоса */
  ctx.save();ctx.globalAlpha=0.3;ctx.fillStyle='#ffffff';ctx.fillRect(-58,-6,120,2.2);ctx.restore();
  /* стекло, водитель */
  poly([[-4,-24],[20,-24],[40,-11],[-12,-11]],'#0b1220');
  ctx.fillStyle='#e8b98f';ctx.beginPath();ctx.arc(10,-17,5.4,0,6.3);ctx.fill();
  ctx.fillStyle='#1f2937';ctx.beginPath();ctx.arc(10,-17.5,5.9,Math.PI*1.02,Math.PI*1.98);ctx.fill();
  fillRR(9,-19.4,9,3.2,1.5,'#05070a');
  ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-12,-11);ctx.lineTo(-10,3);ctx.stroke();
  /* фары */
  fillRR(60,-6,8,3.6,1.5,'#fff7c2');fillRR(-66,-9,3,5,1,o.dead?'#7f1d1d':'#ff2a2a');
  if(o.wheels){wheel(-36,5,13,o.wrot);wheel(38,5,13,o.wrot);}
  ctx.restore();
}
function wheel(x,y,r,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.fillStyle='#0a0c10';ctx.beginPath();ctx.arc(0,0,r,0,6.3);ctx.fill();
  ctx.fillStyle='#9aa7b4';ctx.beginPath();ctx.arc(0,0,r*0.52,0,6.3);ctx.fill();
  ctx.strokeStyle='#0a0c10';ctx.lineWidth=1.6;for(var i=0;i<4;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(i*Math.PI/2)*r*0.5,Math.sin(i*Math.PI/2)*r*0.5);ctx.stroke();}
  ctx.restore();
}
function drawBill(x,y,r){ctx.save();ctx.translate(x,y);ctx.rotate(r);fillRR(-9,-4.5,18,9,1.5,'#22c55e');fillRR(-6.5,-2.5,13,5,1,'#86efac');ctx.fillStyle='#15803d';ctx.beginPath();ctx.arc(0,0,1.8,0,6.3);ctx.fill();ctx.restore();}
function drawCoin(x,y,r){ctx.save();ctx.translate(x,y);ctx.scale(Math.max(0.25,Math.abs(Math.cos(r))),1);ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(0,0,6,0,6.3);ctx.fill();ctx.strokeStyle='#b45309';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(0,0,3.6,0,6.3);ctx.stroke();ctx.restore();}
function drawGlasses(x,y,r){ctx.save();ctx.translate(x,y);ctx.rotate(r);fillRR(-11,-3,9,6,2.5,'#05070a');fillRR(2,-3,9,6,2.5,'#05070a');ctx.fillRect(-3,-1.5,6,1.6);ctx.restore();}
function drawGhost(x,y,alpha,t){
  ctx.save();ctx.translate(x,y);ctx.globalAlpha=alpha;
  ctx.fillStyle='rgba(255,255,255,0.93)';ctx.beginPath();ctx.moveTo(-22,28);ctx.lineTo(-22,0);ctx.arc(0,0,22,Math.PI,0);ctx.lineTo(22,28);
  for(var i=0;i<4;i++){var bx=22-i*11;ctx.quadraticCurveTo(bx-2.75,28+7*Math.sin(t*6+i),bx-5.5,28);ctx.quadraticCurveTo(bx-8.25,28-7*Math.sin(t*6+i),bx-11,28);}
  ctx.closePath();ctx.fill();
  fillRR(-17,-8,15,9,4,'#05070a');fillRR(2,-8,15,9,4,'#05070a');ctx.fillStyle='#05070a';ctx.fillRect(-3,-6,6,2);
  ctx.fillStyle='#05070a';ctx.beginPath();ctx.ellipse(0,10,3.5,4.5,0,0,6.3);ctx.fill();
  ctx.restore();
}

/* ---------- рисование: препятствия ---------- */
function drawBarrier(x,tt){
  ctx.save();ctx.translate(x+(tt>0?Math.min(14,tt*60):0),GROUND);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(8,-44);ctx.lineTo(50,-44);ctx.lineTo(58,0);ctx.closePath();ctx.fillStyle='#e5e7eb';ctx.fill();
  ctx.save();ctx.clip();ctx.fillStyle='#ef4444';for(var i=-1;i<5;i++){ctx.beginPath();ctx.moveTo(i*18,0);ctx.lineTo(i*18+9,0);ctx.lineTo(i*18+27,-44);ctx.lineTo(i*18+18,-44);ctx.closePath();ctx.fill();}ctx.restore();
  fillRR(8,-48,42,5,2,'#fbbf24');
  ctx.restore();
}
function drawCandle(x,tt){
  ctx.save();ctx.translate(x+44,GROUND);
  var a=tt>0?1.5*smooth(tt/1.5)*smooth(tt/1.5):0;ctx.rotate(a);ctx.translate(-44,0);
  fillRR(20,-250,4,60,1,'#ef4444');
  fillRR(0,-190,44,190,3,'#ef4444');ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fillRect(34,-190,10,190);
  ctx.fillStyle='#ffffff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='800 17px '+FONT;ctx.fillText('-90%',22,-150);
  ctx.restore();
}

/* ---------- симуляция обломков (детерминированная функция времени после удара) ---------- */
function simulate(sc,ep,tt){
  var rand=mulberry32((Math.imul(sc.seed,7919)+Math.imul(ep.e,104729))>>>0),i;
  var car={x:CARX,y:497,vx:-150,vy:-330,r:0,w:-5.5};
  var wh=[{x:CARX+51,y:504,vx:180,vy:-380,r:0,w:9},{x:CARX-49,y:504,vx:-90,vy:-300,r:0,w:-7}];
  var gl={x:CARX+14,y:468,vx:120,vy:-420,r:0,w:12};
  var bills=[],coins=[];
  for(i=0;i<34;i++){var an=-2.6+rand()*2.1,sp=150+rand()*270;bills.push({x:CARX+60+rand()*20,y:482,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,r:rand()*6,w:(rand()-0.5)*16,ph:rand()*6});}
  for(i=0;i<22;i++){var an2=-2.7+rand()*2.3,sp2=200+rand()*300;coins.push({x:CARX+55+rand()*25,y:486,vx:Math.cos(an2)*sp2,vy:Math.sin(an2)*sp2,r:rand()*6,w:6+rand()*8});}
  var dt=1/120,n=Math.min(720,Math.floor(tt/dt)),k,b;
  for(k=0;k<n;k++){
    car.vy+=G*dt;car.x+=car.vx*dt;car.y+=car.vy*dt;car.r+=car.w*dt;
    if(car.y>496){car.y=496;if(car.vy>0){car.vy=-car.vy*0.35;if(car.vy>-45)car.vy=0;car.vx*=0.72;car.w*=0.55;}}
    if(car.vy===0){car.vx*=0.985;car.w*=0.97;}
    for(i=0;i<2;i++){b=wh[i];b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.r+=b.w*dt;
      if(b.y>504){b.y=504;if(b.vy>0){b.vy=-b.vy*0.55;if(b.vy>-30)b.vy=0;b.vx*=0.85;}}
      if(b.vy===0){b.vx*=0.995;b.w=b.vx/16;}}
    gl.vy+=G*dt;gl.x+=gl.vx*dt;gl.y+=gl.vy*dt;gl.r+=gl.w*dt;
    if(gl.y>516){gl.y=516;if(gl.vy>0){gl.vy=-gl.vy*0.3;if(gl.vy>-30)gl.vy=0;gl.vx*=0.6;gl.w*=0.5;}}
    for(i=0;i<bills.length;i++){b=bills[i];if(b.landed)continue;var dr=Math.exp(-1.6*dt);b.vx*=dr;b.vy=b.vy*dr+260*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.r+=b.w*dt;if(b.y>516){b.y=516;b.landed=true;}}
    for(i=0;i<coins.length;i++){b=coins[i];b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.r+=b.w*dt;if(b.y>514){b.y=514;if(b.vy>0){b.vy=-b.vy*0.5;if(b.vy>-30)b.vy=0;b.vx*=0.85;}}}
  }
  return {car:car,wh:wh,gl:gl,bills:bills,coins:coins};
}

/* ---------- кадр ---------- */
function layerDraw(arr,pw,par,s,base,color,windows,accent){
  var off=-((s*par)%pw),rep,i,b;
  for(rep=0;rep<3;rep++){
    for(i=0;i<arr.length;i++){

  function onSrvResult(d){statusEl.textContent=d.win?tx0.win.replace('+1','+'+d.pts):tx0.lose;track('result',{win:d.win,pts:d.pts});}
  function onSrvMe(d){scoreEl.textContent='★ '+d.pts+' · '+d.w+'/'+d.n+(d.streak>1?' · 🔥'+d.streak:'')+(d.rank?' · #'+d.rank:'');}
  if(window.CPChat)CPChat.init({room:GAME+':'+lang,lang:lang,ph:(btns[0].textContent+' / '+btns[1].textContent+'…'),onEvent:track,onSkew:function(ms){synced=true;skew=ms/1000;},onState:onSrvState,onPick:applyPick,onResult:onSrvResult,onMe:onSrvMe});
  var rgEl=document.createElement('div');rgEl.textContent=RG[lang]||RG.en;rgEl.style.cssText='text-align:center;font-size:12px;opacity:.55;margin:10px 0 4px;';document.body.appendChild(rgEl);
  var stats={w:0,n:0};
  try{var raw=localStorage.getItem('cpRekt');if(raw)stats=JSON.parse(raw)||stats;}catch(e){}
  stats={w:Math.max(0,+stats.w|0),n:Math.max(0,+stats.n|0)};if(stats.w>stats.n)stats.w=stats.n;  /* защита от битого localStorage */
  function showScore(){scoreEl.textContent=stats.w+' / '+stats.n;}
  function saveScore(){try{localStorage.setItem('cpRekt',JSON.stringify(stats));}catch(e){}}
  scene=buildScene(seed0,{skin:q.get('skin'),lang:lang,bonus:null,url:q.get('url')});
  var startE=3,t0ms=performance.now(),lastE=-1,choice=0,doneE=-1;
  /* --- общий эфир 24/7: без ?seed= у всех зрителей одно и то же время, один график и один раунд, как стрим ---
     время считается от фиксированной даты по часам, а не от открытия страницы; с ?seed=N страница идёт приватно с нуля */
  var SHARED=!q.get('seed'),EPOCH=EN.EPOCH,skew=0,synced=false;
  function nowT(U){return SHARED?(Date.now()/1000+skew-EPOCH):3*U+(performance.now()-t0ms)/1000;}
  if(SHARED&&location.protocol.indexOf('http')===0){  /* подстройка под часы сервера, чтобы кривые часы устройства не сдвигали эфир */
    var ts=Date.now();
    try{fetch(location.href,{method:'HEAD',cache:'no-store'}).then(function(r){var d=Date.parse(r.headers.get('Date')||'');if(d&&!synced){var mid=(ts+Date.now())/2;skew=(d-mid)/1000;}}).catch(function(){});}catch(e){}
  }
  showScore();
  (function frame(){
    var T=nowT(E);
    var e=Math.floor(T/E),u=T-e*E;
    if(e!==lastE){lastE=e;choice=0;btns.forEach(function(b){b.classList.remove('sel');b.disabled=false;});statusEl.textContent=tx0.hint;}
    if(u>=TI-0.3)btns.forEach(function(b){b.disabled=true;});
    if(u>=TI+0.8&&doneE!==e){
      doneE=e;
      if(choice!==0&&!serverMode){stats.n++;if((choice===1)===episode(scene.seed,e).survive){stats.w++;statusEl.textContent=tx0.win;}else statusEl.textContent=tx0.lose;track('result',{w:stats.w,n:stats.n});saveScore();showScore();}
    }
    draw(T);
    requestAnimationFrame(frame);
  })();
  btns.forEach(function(b){b.addEventListener('click',function(){
    var T=nowT(E),u=T-Math.floor(T/E)*E;
    if(u>=TI-0.3||choice!==0)return;
    choice=+b.dataset.d;b.classList.add('sel');track('pick',{d:choice});if(serverMode)CPChat.pick(choice);
  });});
}
})();
</script>
