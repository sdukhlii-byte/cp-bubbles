<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:;">
<title>Coinplay Coin Run</title>
<style>
  html,body{margin:0;background:#000}
  canvas{display:block;height:1920px;width:1080px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="engine.js"></script>
<script>
/* «Монета на трассе»: график как рельеф, монета катится по нему, камера едет следом.
   Только запись роликов. Исход раунда тот же, что в chart (движок общий), просто другая картинка. */
(function(){
'use strict';
var W=540,H=960,S=2;
var FONT='system-ui,"Segoe UI",Roboto,Arial,"Liberation Sans","DejaVu Sans",sans-serif';
var EN=CPEngine,P=EN.chart.P,PRED=EN.chart.PRED,price=EN.chart.price,roundInfo=EN.chart.roundInfo,hash=EN.hash;
var BRAND_RE=/^coinplay\.com(\/[A-Za-z0-9_-]{1,24})?$/;
var UPC='#22c55e',DNC='#ef4444';
var XC=170,PXS=30,BT=300,BB=790;       /* монета на x=170, 30 px на секунду, вертикальная полоса цены */
var TXT={
  en:{q:'Above or below the line?',hint:'In 10 seconds. Comment UP or DOWN',up:'UP',down:'DOWN',ans:'Result:'},
  ru:{q:'Выше или ниже линии?',hint:'Через 10 секунд. Пиши ВВЕРХ или ВНИЗ',up:'ВВЕРХ',down:'ВНИЗ',ans:'Итог:'},
  es:{q:'¿Sobre o bajo la línea?',hint:'En 10 segundos. Comenta SUBE o BAJA',up:'SUBE',down:'BAJA',ans:'Resultado:'}
};
var SKINS={
  gold:{bg1:'#0b0f14',bg2:'#151b25',accent:'#f5b83d'},
  cyan:{bg1:'#060c14',bg2:'#0e1b2b',accent:'#38d6f5'},
  violet:{bg1:'#0b0814',bg2:'#1a1230',accent:'#b27cff'},
  mono:{bg1:'#0b0b0c',bg2:'#1a1a1d',accent:'#e5e7eb'}
};
var SKIN_NAMES=Object.keys(SKINS);
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W*S;cv.height=H*S;
var scene=null;

function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function fillRR(x,y,w,h,r,c){ctx.fillStyle=c;rr(x,y,w,h,r);ctx.fill();}
function fitText(str,weight,maxSize,maxW){var s=maxSize;ctx.font=weight+' '+s+'px '+FONT;var w=ctx.measureText(str).width;if(w>maxW){s=Math.floor(s*maxW/w);ctx.font=weight+' '+s+'px '+FONT;}return s;}
function smooth(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
function bigText(str,x,y,size,alpha,fill){ctx.save();ctx.globalAlpha=alpha;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='800 '+size+'px '+FONT;ctx.lineWidth=size*0.12;ctx.strokeStyle='#05070a';ctx.lineJoin='round';ctx.strokeText(str,x,y);ctx.fillStyle=fill||'#ffffff';ctx.fillText(str,x,y);ctx.restore();}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function h01(a,b,c){return EN.h01(a*7919+(c||0)*104729,b);}

function draw(T){
  var sc=scene,sk=SKINS[sc.skin],tx=TXT[sc.lang]||TXT.en,seed=sc.seed;
  var r=Math.floor(T/P),u=T-r*P,info=roundInfo(seed,r),reveal=u>=PRED,i,t;
  ctx.setTransform(S,0,0,S,0,0);
  ctx.clearRect(0,0,W,H);

  /* вертикальная шкала: последние 12 секунд + уровень раунда */
  var mn=info.line,mx=info.line,p;
  for(i=0;i<=24;i++){p=price(seed,T-12+i*0.5);if(p<mn)mn=p;if(p>mx)mx=p;}
  p=price(seed,T);if(p<mn)mn=p;if(p>mx)mx=p;
  var pad=Math.max(4,(mx-mn)*0.3),lo=mn-pad,hi=mx+pad;
  function yOf(v){return BB-(v-lo)/(hi-lo)*(BB-BT);}
  function xOf(tt){return XC+(tt-T)*PXS;}
  var yc=yOf(price(seed,T));

  /* фон */
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,sk.bg1);g.addColorStop(1,sk.bg2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  /* камера: наезд к моменту решения и тряска после итога */
  var zoom=1+0.32*smooth((u-6.5)/3.5)*(reveal?0:1)+(reveal?0.32*(1-smooth((u-PRED)/2.5)):0);
  var shake=reveal?7*Math.exp(-4*(u-PRED)):0;
  ctx.save();
  ctx.translate(XC+Math.sin(T*70)*shake,yc+Math.cos(T*83)*shake);ctx.scale(zoom,zoom);ctx.translate(-XC,-yc);

  /* звёзды: параллакс 0.3 */
  for(i=0;i<70;i++){
    var wx=(h01(seed,i,11)*1400)-((T*PXS*0.3)%1400),sx=((wx%1400)+1400)%1400-200,sy=h01(seed,i,12)*H;
    var tw=0.25+0.35*(0.5+0.5*Math.sin(T*2+i*1.7));
    ctx.fillStyle='rgba(255,255,255,'+(tw*0.7).toFixed(3)+')';ctx.fillRect(sx,sy,1.4,1.4);
  }

  /* рельеф: колонки-«свечи» под кривой, потом сама линия */
  var CD=0.75,k,xr;
  for(k=Math.floor((T-XC/PXS-1)/CD);k<=Math.floor(T/CD);k++){
    var s0=k*CD,e=Math.min((k+1)*CD,T);if(e-s0<0.02)continue;
    var op=price(seed,s0),cl=price(seed,e),top=yOf(Math.max(op,cl)),x0=xOf(s0),x1=xOf(e);
    ctx.fillStyle=cl>=op?'rgba(34,197,94,0.20)':'rgba(239,68,68,0.20)';
    ctx.fillRect(x0,top,Math.max(1,x1-x0-1.5),H-top);
  }
  var tStart=T-(XC+20)/PXS,prevx=null,prevy=null,col;
  ctx.lineWidth=4.5;ctx.lineCap='round';ctx.lineJoin='round';
  for(t=tStart;t<=T+1e-6;t+=0.1){
    var tt2=Math.min(t,T),x2=xOf(tt2),y2=yOf(price(seed,tt2));
    if(prevx!==null){
      col=y2<=prevy?UPC:DNC;
      ctx.strokeStyle=col;ctx.globalAlpha=0.35+0.65*Math.max(0,Math.min(1,(x2)/XC));
      ctx.beginPath();ctx.moveTo(prevx,prevy);ctx.lineTo(x2,y2);ctx.stroke();
    }
    prevx=x2;prevy=y2;
  }
  ctx.globalAlpha=1;

  /* уровень раунда и ворота (финиш) */
  var yL=yOf(info.line),xS=xOf(info.t0),xE=xOf(info.t0+PRED);
  var la=smooth(u/0.5)*(1-smooth((u-12.5)/1));
  if(la>0.01){
    ctx.save();ctx.globalAlpha=la;
    ctx.setLineDash([9,7]);ctx.lineWidth=2.4;ctx.strokeStyle=sk.accent;ctx.beginPath();ctx.moveTo(Math.max(xS,-20),yL);ctx.lineTo(xE,yL);ctx.stroke();ctx.setLineDash([]);
    /* опоры ворот */
    ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.beginPath();ctx.moveTo(xE,BT-70);ctx.lineTo(xE,BB+90);ctx.stroke();
    /* планка на уровне линии */
    var pulse=0.5+0.5*Math.sin(T*6),bw=70;
    ctx.shadowColor=sk.accent;ctx.shadowBlur=14+10*pulse;fillRR(xE-bw/2,yL-4,bw,8,4,sk.accent);ctx.shadowBlur=0;
    /* зоны: UP над планкой, DOWN под ней */
    var winUp=reveal&&info.dir>0,winDn=reveal&&info.dir<0;
    function chip(label,cx,cy,c,won,dim){ctx.save();ctx.globalAlpha=la*(dim?0.3:1);ctx.font='800 16px '+FONT;var w=ctx.measureText(label).width+22;fillRR(cx-w/2,cy-14,w,28,14,won?c:'rgba(8,11,16,0.85)');ctx.lineWidth=2;ctx.strokeStyle=c;rr(cx-w/2,cy-14,w,28,14);ctx.stroke();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=won?'#06120a':c;ctx.fillText(label,cx,cy+1);ctx.restore();}
    chip('▲ '+tx.up,xE+0,yL-34,UPC,winUp,reveal&&!winUp);
    chip('▼ '+tx.down,xE+0,yL+34,DNC,winDn,reveal&&!winDn);
    ctx.restore();
  }

  /* след за монетой */
  var R=17,sl,nx,ny,ang;
  var dy=(yOf(price(seed,T+0.01))-yOf(price(seed,T-0.15)))/(0.16*PXS);   /* наклон кривой */
  ang=Math.atan(dy);nx=Math.sin(ang);ny=-Math.cos(ang);                   /* нормаль вверх */
  for(i=1;i<=10;i++){
    var ta=T-i*0.06,ax=xOf(ta),ay=yOf(price(seed,ta))-R*0.9;
    ctx.fillStyle='rgba(255,226,122,'+(0.5*(1-i/10)).toFixed(3)+')';ctx.beginPath();ctx.arc(ax,ay,R*0.5*(1-i/12),0,6.3);ctx.fill();
  }
  /* монета: угол по длине пути */
  var arc=0,ps=price(seed,T-8),pt;
  for(t=T-8+0.1;t<=T+1e-6;t+=0.1){pt=price(seed,Math.min(t,T));arc+=Math.sqrt(0.1*PXS*0.1*PXS+Math.pow((yOf(pt)-yOf(ps)),2));ps=pt;}
  var cx0=XC+nx*R*0.0,cy0=yc-R*0.95;
  ctx.save();ctx.translate(cx0,cy0);
  ctx.shadowColor=sk.accent;ctx.shadowBlur=20;
  var cg=ctx.createRadialGradient(-5,-6,2,0,0,R);cg.addColorStop(0,'#fff3b0');cg.addColorStop(0.55,'#f5b83d');cg.addColorStop(1,'#b87a12');
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,R,0,6.3);ctx.fill();ctx.shadowBlur=0;
  ctx.rotate(arc/R);
  ctx.lineWidth=2.2;ctx.strokeStyle='rgba(120,70,0,0.75)';ctx.beginPath();ctx.arc(0,0,R-3.5,0,6.3);ctx.stroke();
  ctx.fillStyle='rgba(120,70,0,0.85)';ctx.font='800 17px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('C',0,1);
  ctx.restore();

  /* искры итога */
  if(reveal){
    var wc=info.dir>0?UPC:DNC,age=u-PRED;
    for(i=0;i<46;i++){
      var a=h01(seed,r*100+i,21)*6.283,sp=60+h01(seed,r*100+i,22)*220,life=0.8+h01(seed,r*100+i,23)*0.9;
      if(age>life)continue;
      var px_=XC+Math.cos(a)*sp*age,py_=cy0+Math.sin(a)*sp*age+160*age*age*(info.dir>0?1:1.4),al=1-age/life;
      ctx.fillStyle=wc;ctx.globalAlpha=al;ctx.beginPath();ctx.arc(px_,py_,2.2+2*al,0,6.3);ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  /* придорожный знак с адресом: стоит на земле, едет вместе с миром, на высоту цены не завязан */
  var sg=Math.floor((T-8)/22)+0,m;
  for(m=sg;m<=sg+2;m++){
    var sx2=xOf(m*22+9),sy2=BB+120;
    if(sx2<-130||sx2>W+130)continue;
    ctx.fillStyle='#232b36';ctx.fillRect(sx2-3,sy2,6,60);
    fillRR(sx2-78,sy2-30,156,32,8,'rgba(8,11,16,0.9)');
    ctx.lineWidth=1.6;ctx.strokeStyle='rgba(255,255,255,0.22)';rr(sx2-78,sy2-30,156,32,8);ctx.stroke();
    ctx.textAlign='center';ctx.textBaseline='middle';fitText(sc.url,'700',17,140);ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fillText(sc.url,sx2,sy2-13);
  }
  ctx.restore();

  /* вспышка при итоге */
  if(reveal){var fl=Math.max(0,1-(u-PRED)/0.35);if(fl>0){ctx.save();ctx.globalAlpha=0.28*fl;ctx.fillStyle=info.dir>0?UPC:DNC;ctx.fillRect(0,0,W,H);ctx.restore();}}
  /* виньетка */
  var vg=ctx.createRadialGradient(W/2,H*0.5,H*0.25,W/2,H*0.5,H*0.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  /* цена и верхняя панель */
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.font='700 13px '+FONT;ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillText(sc.pair,26,232);
  ctx.font='800 34px '+FONT;ctx.fillStyle='#ffffff';var cur=price(seed,T);ctx.fillText(cur.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','),26,262);
  var l1,l2=null,c1='#ffffff';
  if(reveal){l1=tx.ans+' '+(info.dir>0?tx.up:tx.down);c1=info.dir>0?UPC:DNC;}else{l1=tx.q;l2=tx.hint;}
  fillRR(30,104,480,92,18,'rgba(8,11,16,0.88)');
  ctx.lineWidth=2;ctx.strokeStyle=sk.accent;rr(30,104,480,92,18);ctx.stroke();
  ctx.textAlign='center';
  if(l2===null){fitText(l1,'800',44,440);ctx.fillStyle=c1;ctx.fillText(l1,270,150);}
  else{fitText(l1,'800',36,440);ctx.fillStyle=c1;ctx.fillText(l1,270,141);fitText(l2,'600',22,440);ctx.fillStyle=sk.accent;ctx.fillText(l2,270,177);}
  /* отсчёт и разница */
  if(u<PRED){
    var n=Math.ceil(PRED-u),f=u%1;
    if(n<=3)bigText(String(n),W-90,262,86*(1+0.35*Math.max(0,1-f*4)),1-f*0.35);
    else{ctx.save();ctx.globalAlpha=0.14;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='800 80px '+FONT;ctx.fillStyle='#fff';ctx.fillText(String(n),W-90,262);ctx.restore();}
  }else if(u<13.8){
    var d=info.end-info.line,al=1-smooth((u-13)/0.8);
    bigText((d>=0?'+':'')+d.toFixed(2),W-110,262,46,al*smooth((u-PRED)/0.25),d>=0?UPC:DNC);
  }
}

window.setup=function(o){
  var seed=o.seed|0,rounds=Math.max(1,o.rounds|0||1),minm=(o.minmargin!=null)?+o.minmargin:6,r0;
  if(o.round!=null)r0=+o.round;
  else{r0=3;
    var tense=function(rr_){var inf=roundInfo(seed,rr_);if(inf.margin<Math.max(minm,4))return false;var d=price(seed,inf.t0+8.5)-inf.line;return (d>0)!==(inf.dir>0)&&Math.abs(d)>1;};
    if(o.tension!==false){while(r0<1500&&!tense(r0))r0++;if(r0>=1500){r0=3;while(r0<400&&roundInfo(seed,r0).margin<minm)r0++;}}
    else while(r0<400&&roundInfo(seed,r0).margin<minm)r0++;}
  var rnd=mulberry32(((seed>>>0)^0x9e3779b9)>>>0);
  var skin=(o.skin&&SKINS[o.skin])?o.skin:SKIN_NAMES[Math.floor(rnd()*SKIN_NAMES.length)];
  scene={seed:seed,skin:skin,T0:r0*P,lang:TXT[o.lang]?o.lang:'en',url:(o.url&&BRAND_RE.test(String(o.url)))?String(o.url):'coinplay.com',pair:(o.pair&&/^[A-Z0-9]{2,10}\/[A-Z0-9]{2,10}$/.test(String(o.pair)))?String(o.pair):'COIN/USDT'};
  var tones=[],n;
  for(n=0;n<rounds;n++){
    var inf=roundInfo(seed,r0+n),b=n*P;
    tones.push({f:1000,at:b+7,d:0.07},{f:1000,at:b+8,d:0.07},{f:1000,at:b+9,d:0.07});
    if(inf.dir>0){tones.push({f:880,at:b+10,d:0.2},{f:1320,at:b+10.12,d:0.3});}
    else{tones.push({f:392,at:b+10,d:0.25},{f:294,at:b+10.12,d:0.35});}
  }
  var first=roundInfo(seed,r0);
  return {bed:true,letter:first.dir>0?'UP':'DOWN',skin:skin,duration:rounds*P+1,tones:tones,round:r0,margin:+first.margin.toFixed(2)};
};
window.renderFrame=function(t){draw(scene.T0+t);};
window.__ready=true;
})();
</script>
</body>
</html>
