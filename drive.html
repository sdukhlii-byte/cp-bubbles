<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:;">
<title>Coinplay Drive</title>
<style>
  html,body{margin:0;background:#000}
  canvas{display:block;height:1920px;width:1080px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="engine.js"></script>
<script>
/* «Развилка»: вид сзади и сверху, псевдо-3D. Машина едет к развилке, зритель гадает, на какой знак (A/B/C) она свернёт.
   Только запись роликов. Исход зависит только от seed, кадр = чистая функция времени. */
(function(){
'use strict';
var W=540,H=960,S=2;
var FONT='system-ui,"Segoe UI",Roboto,Arial,"Liberation Sans","DejaVu Sans",sans-serif';
var EN=CPEngine;
var BRAND_RE=/^coinplay\.com(\/[A-Za-z0-9_-]{1,24})?$/;
var HOR=330,F=545,CAMH=5,CAMBACK=8;         /* горизонт, фокус, высота камеры, дистанция до машины */
var HW=3.5,ZF=64,LB=32,LX=27,ZEND=ZF+LB,V=8; /* полуширина дороги, развилка, длина веток, разнос веток, скорость */
var TCHOOSE=8,TOTAL=15;
var LET=['A','B','C'],SIDE=[-1,0,1];
var TXT={
  en:{q:'Where will the car go?',hint:'Comment A, B or C',ans:'Answer:'},
  ru:{q:'Куда поедет машина?',hint:'Пиши A, B или C в комментариях',ans:'Ответ:'},
  es:{q:'¿A dónde irá el coche?',hint:'Comenta A, B o C',ans:'Respuesta:'}
};
var SKINS={
  gold:{sky1:'#07090e',sky2:'#2a2112',glow:'#f5b83d',car:'#f5b83d',accent:'#f5b83d'},
  cyan:{sky1:'#050a12',sky2:'#0c2a3a',glow:'#38d6f5',car:'#38d6f5',accent:'#38d6f5'},
  violet:{sky1:'#080612',sky2:'#2a1650',glow:'#b27cff',car:'#b27cff',accent:'#b27cff'},
  mono:{sky1:'#08090b',sky2:'#23262c',glow:'#dfe3ea',car:'#2fe0a0',accent:'#2fe0a0'}
};
var SKIN_NAMES=Object.keys(SKINS);
var UPC='#22c55e';
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W*S;cv.height=H*S;
var scene=null;

function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function fillRR(x,y,w,h,r,c){ctx.fillStyle=c;rr(x,y,w,h,r);ctx.fill();}
function fitText(str,weight,maxSize,maxW){var s=maxSize;ctx.font=weight+' '+s+'px '+FONT;var w=ctx.measureText(str).width;if(w>maxW){s=Math.floor(s*maxW/w);ctx.font=weight+' '+s+'px '+FONT;}return s;}
function smooth(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
function clamp(x,a,b){return x<a?a:x>b?b:x;}
function bigText(str,x,y,size,alpha,fill){ctx.save();ctx.globalAlpha=alpha;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='800 '+size+'px '+FONT;ctx.lineWidth=size*0.12;ctx.strokeStyle='#05070a';ctx.lineJoin='round';ctx.strokeText(str,x,y);ctx.fillStyle=fill||'#ffffff';ctx.fillText(str,x,y);ctx.restore();}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function h01(a,b,c){return EN.h01(a*7919+(c||0)*104729,b);}

/* ---------- мир ---------- */
function branchX(side,Z){ if(side===0||Z<=ZF) return 0; return side*LX*smooth((Z-ZF)/LB); }
function zOfT(t){                       /* путь машины по времени: равномерно до конца веток, потом торможение */
  if(t<=ZEND/V) return V*t;
  var dt=t-ZEND/V,tb=1.2; if(dt>=tb) return ZEND+V*tb/2;
  return ZEND+V*dt-V*dt*dt/(2*tb);
}
function carX(t,side,phase){
  var Z=zOfT(t);
  var amp=2.3*smooth(t/3.5)*(1-smooth((t-(TCHOOSE-1.4))/1.2));       /* виляние перед развилкой: зритель не знает, куда */
  var weave=amp*Math.sin(t*2.0+phase)+0.5*amp*Math.sin(t*3.3+phase*2);
  return branchX(side,Z)+weave;
}

function draw(T){
  var sc=scene,sk=SKINS[sc.skin],tx=TXT[sc.lang]||TXT.en,side=SIDE[sc.outcome];
  var t=Math.min(T,TOTAL),i,j;
  ctx.setTransform(S,0,0,S,0,0);ctx.clearRect(0,0,W,H);

  var carZ=zOfT(t),cx_=carX(t,side,sc.phase),camZ=carZ-CAMBACK,camX=branchX(side,carZ)+(cx_-branchX(side,carZ))*0.5;
  var hd=(carX(t+0.05,side,sc.phase)-carX(t-0.05,side,sc.phase))/(Math.max(0.1,zOfT(t+0.05)-zOfT(t-0.05)));  /* курс */
  function pr(X,Y,Z){var d=Z-camZ;if(d<0.6)return null;var s=F/d;return [W/2+(X-camX)*s,HOR+(CAMH-Y)*s,s,d];}
  var reveal=t>=TCHOOSE;

  /* небо */
  var g=ctx.createLinearGradient(0,0,0,HOR);g.addColorStop(0,sk.sky1);g.addColorStop(1,sk.sky2);ctx.fillStyle=g;ctx.fillRect(0,0,W,HOR+1);
  /* дальний силуэт города */
  ctx.fillStyle='rgba(0,0,0,0.38)';
  for(i=0;i<36;i++){var bx=((i*17.5)-camX*0.4+W*2)%(W+40)-20,bh=18+h01(sc.seed,i,3)*58;ctx.fillRect(bx,HOR-bh,15,bh+1);}
  ctx.fillStyle='rgba(255,255,255,0.35)';
  for(i=0;i<36;i++){var bx2=((i*17.5)-camX*0.4+W*2)%(W+40)-20,bh2=18+h01(sc.seed,i,3)*58;for(j=0;j<bh2/9;j++){if(h01(sc.seed,i*30+j,4)<0.4)ctx.fillRect(bx2+3+(j%2)*6,HOR-bh2+4+j*9,2,2);}}
  /* земля */
  g=ctx.createLinearGradient(0,HOR,0,H);g.addColorStop(0,'#0d1117');g.addColorStop(1,'#07090c');ctx.fillStyle=g;ctx.fillRect(0,HOR,W,H-HOR);
  /* огни далёкого города на земле */
  for(i=0;i<110;i++){
    var dX=(h01(sc.seed,i,5)*2-1)*90,dZ=30+h01(sc.seed,i,6)*110;
    if(Math.abs(dX)<HW+4&&dZ<ZEND)continue;
    var q=pr(dX,0,dZ);if(!q)continue;
    ctx.fillStyle='rgba(255,226,160,'+(0.15+0.35*h01(sc.seed,i,7)).toFixed(2)+')';ctx.fillRect(q[0],q[1],1.6,1.6);
  }

  /* дороги: сначала светлая окантовка, потом полотно */
  function ribbon(side_,z0,z1,hw,fill){
    var pts=[],Z,st;
    for(Z=z0;Z<=z1+0.001;Z+=(Z-camZ<18?0.8:2)){var q1=pr(branchX(side_,Z)-hw,0,Z),q2=pr(branchX(side_,Z)+hw,0,Z);if(!q1||!q2)continue;pts.push([q1,q2]);}
    if(pts.length<2)return;
    ctx.beginPath();ctx.moveTo(pts[0][0][0],pts[0][0][1]);
    for(st=1;st<pts.length;st++)ctx.lineTo(pts[st][0][0],pts[st][0][1]);
    for(st=pts.length-1;st>=0;st--)ctx.lineTo(pts[st][1][0],pts[st][1][1]);
    ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  }
  var zs=camZ+1.2,ze=ZEND+8;
  var rg=ctx.createLinearGradient(0,HOR,0,H);rg.addColorStop(0,'#1a2029');rg.addColorStop(0.3,'#222a35');rg.addColorStop(1,'#2b3340');
  for(i=0;i<3;i++){ribbon(SIDE[i],i===1?zs:Math.max(zs,ZF-1.5),ze,HW+0.45,'rgba(150,160,175,0.55)');}
  ribbon(0,zs,ZF+1,HW+0.45,'rgba(150,160,175,0.55)');
  for(i=0;i<3;i++){ribbon(SIDE[i],i===1?zs:Math.max(zs,ZF-1.5),ze,HW,rg);}
  ribbon(0,zs,ZF+1,HW,rg);
  /* разметка: пунктир по осям */
  ctx.fillStyle='rgba(255,255,255,0.8)';
  for(i=0;i<3;i++){
    var sd=SIDE[i],zStart=Math.max(zs,sd===0?zs:ZF+2);
    var k0=Math.floor((zStart-1)/7)*7;
    for(var zz=k0;zz<ze;zz+=7){
      var za=Math.max(zz,zs),zb=Math.min(zz+3,ze);if(zb<=za+0.05)continue;if(sd!==0&&za<ZF+2)continue;
      var a1=pr(branchX(sd,za)-0.14,0,za),a2=pr(branchX(sd,za)+0.14,0,za),b1=pr(branchX(sd,zb)-0.14,0,zb),b2=pr(branchX(sd,zb)+0.14,0,zb);
      if(!a1||!a2||!b1||!b2)continue;
      ctx.beginPath();ctx.moveTo(a1[0],a1[1]);ctx.lineTo(a2[0],a2[1]);ctx.lineTo(b2[0],b2[1]);ctx.lineTo(b1[0],b1[1]);ctx.closePath();ctx.fill();
    }
  }
  /* туман у горизонта */
  g=ctx.createLinearGradient(0,HOR-6,0,HOR+110);g.addColorStop(0,sk.sky2);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.globalAlpha=0.85;ctx.fillRect(0,HOR-6,W,116);ctx.globalAlpha=1;

  /* объекты: от дальних к ближним */
  var objs=[];
  for(i=0;i<9;i++){
    for(j=0;j<2;j++){
      var sg=j?1:-1,bz=-16+i*9.2+h01(sc.seed,i*2+j,8)*2,bw=4+h01(sc.seed,i*2+j,9)*4,bh3=7+h01(sc.seed,i*2+j,10)*22,gap=HW+4.2+h01(sc.seed,i*2+j,11)*3;
      if(bz>ZF-14)continue;
      objs.push({z:bz,k:'b',sg:sg,bz:bz,bw:bw,bh:bh3,gap:gap,id:i*2+j});
    }
  }
  for(i=-3;i<8;i++){objs.push({z:i*10,k:'p',sg:-1});objs.push({z:i*10,k:'p',sg:1});}
  objs.push({z:26,k:'bb',sg:-1,x:-8.2});objs.push({z:48,k:'bb',sg:1,x:8.2});
  for(i=0;i<3;i++)objs.push({z:-1e9,rz:ZEND+8,k:'s',i:i});
  objs.sort(function(a,b){return b.z-a.z;});

  function face(fn,nc,nr,col,wcol,seedk,wp){
    /* грань как сетка окон: fn(u,v)->[X,Y,Z] */
    var c0=pr.apply(null,fn(0,0)),c1=pr.apply(null,fn(1,0)),c2=pr.apply(null,fn(1,1)),c3=pr.apply(null,fn(0,1));
    if(!c0||!c1||!c2||!c3)return;
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(c0[0],c0[1]);ctx.lineTo(c1[0],c1[1]);ctx.lineTo(c2[0],c2[1]);ctx.lineTo(c3[0],c3[1]);ctx.closePath();ctx.fill();
    var a,b,cell=0;
    for(a=0;a<nc;a++)for(b=0;b<nr;b++){
      cell++;if(h01(sc.seed,seedk*100+cell,12)>wp)continue;
      var u0=(a+0.22)/nc,u1=(a+0.78)/nc,v0=(b+0.2)/nr,v1=(b+0.7)/nr;
      var w0=pr.apply(null,fn(u0,v0)),w1=pr.apply(null,fn(u1,v0)),w2=pr.apply(null,fn(u1,v1)),w3=pr.apply(null,fn(u0,v1));
      if(!w0||!w1||!w2||!w3)continue;
      ctx.fillStyle=wcol;ctx.beginPath();ctx.moveTo(w0[0],w0[1]);ctx.lineTo(w1[0],w1[1]);ctx.lineTo(w2[0],w2[1]);ctx.lineTo(w3[0],w3[1]);ctx.closePath();ctx.fill();
    }
  }
  for(i=0;i<objs.length;i++){
    var o=objs[i],dd=(o.rz||o.z)-camZ;
    if(dd<1.5)continue;
    if(o.k==='b'){
      var xin=o.sg*o.gap,xout=o.sg*(o.gap+o.bw),zf=o.bz,zb=o.bz+6;
      ctx.save();ctx.globalAlpha=clamp(1.4-dd/95,0.3,1);
      face(function(u,v){return [xin,v*o.bh,zf+u*6];},3,Math.max(2,Math.round(o.bh/3)),'#10141b','rgba(255,214,140,0.8)',o.id,0.55);   /* стена к дороге */
      face(function(u,v){return [xin+(xout-xin)*u,v*o.bh,zf];},3,Math.max(2,Math.round(o.bh/3)),'#161b24','rgba(255,214,140,0.85)',o.id+50,0.55);    /* фасад */
      ctx.restore();
    }else if(o.k==='p'){
      var p0=pr(o.sg*(HW+1.2),0,o.z),p1=pr(o.sg*(HW+1.2),5.8,o.z);if(!p0||!p1)continue;
      ctx.strokeStyle='#2b323d';ctx.lineWidth=Math.max(1,0.14*p0[2]);ctx.beginPath();ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p1[0],p1[1]);ctx.stroke();
      var ph=pr(o.sg*(HW-0.3),5.8,o.z);if(ph){ctx.strokeStyle='#2b323d';ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(ph[0],ph[1]);ctx.stroke();
        var rg2=ctx.createRadialGradient(ph[0],ph[1],0,ph[0],ph[1],0.9*ph[2]);rg2.addColorStop(0,'rgba(255,230,170,0.85)');rg2.addColorStop(1,'rgba(255,230,170,0)');ctx.fillStyle=rg2;ctx.fillRect(ph[0]-ph[2],ph[1]-ph[2],2*ph[2],2*ph[2]);}
    }else if(o.k==='bb'){
      var bxm=o.x,bzz=o.z,w2=4.2,h2=1.8,y0=1.0;
      var q0=pr(bxm-w2,y0,bzz),q1=pr(bxm+w2,y0,bzz),q2=pr(bxm+w2,y0+h2*2,bzz),q3=pr(bxm-w2,y0+h2*2,bzz);
      if(!q0||!q1||!q2||!q3)continue;
      var pl=pr(bxm-w2*0.6,0,bzz),pr_=pr(bxm+w2*0.6,0,bzz);
      ctx.strokeStyle='#2b323d';ctx.lineWidth=Math.max(1,0.2*q0[2]);ctx.beginPath();ctx.moveTo(pl[0],pl[1]);ctx.lineTo(pl[0],q0[1]);ctx.moveTo(pr_[0],pr_[1]);ctx.lineTo(pr_[0],q1[1]);ctx.stroke();
      ctx.fillStyle='#0a0d12';ctx.beginPath();ctx.moveTo(q0[0],q0[1]);ctx.lineTo(q1[0],q1[1]);ctx.lineTo(q2[0],q2[1]);ctx.lineTo(q3[0],q3[1]);ctx.closePath();ctx.fill();
      ctx.lineWidth=Math.max(1,0.12*q0[2]);ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.stroke();
      var bw_=q1[0]-q0[0],cxm=(q0[0]+q1[0])/2,cym=(q0[1]+q3[1])/2;
      ctx.textAlign='center';ctx.textBaseline='middle';
      var fs=fitText(sc.url,'800',Math.max(6,bw_*0.17),bw_*0.86);ctx.fillStyle='rgba(255,255,255,0.88)';ctx.fillText(sc.url,cxm,cym-fs*0.55);
      fitText(sc.bonus,'600',Math.max(5,bw_*0.085),bw_*0.86);ctx.fillStyle=sk.accent;ctx.fillText(sc.bonus,cxm,cym+fs*0.55);
    }else if(o.k==='s'){
      var sd2=SIDE[o.i],sx=branchX(sd2,ZEND)*1,qs=pr(sx,7.2,ZEND+8),qb=pr(sx,0,ZEND+8);
      if(!qs||!qb)continue;
      var win=reveal&&o.i===sc.outcome,dim=reveal&&!win,R=clamp(3.1*qs[2],15,46),pulse=win?(0.5+0.5*Math.sin(t*9)):0;
      ctx.save();ctx.globalAlpha=dim?0.35:1;
      ctx.strokeStyle='#3a4250';ctx.lineWidth=Math.max(1.5,0.22*qs[2]);ctx.beginPath();ctx.moveTo(qb[0],qb[1]);ctx.lineTo(qs[0],qs[1]);ctx.stroke();
      ctx.shadowColor=win?UPC:'#ffffff';ctx.shadowBlur=win?(18+14*pulse):10;
      ctx.fillStyle=win?UPC:'#0a0d12';ctx.beginPath();ctx.arc(qs[0],qs[1],R,0,6.3);ctx.fill();ctx.shadowBlur=0;
      ctx.lineWidth=Math.max(2,0.35*qs[2]);ctx.strokeStyle=win?'#eafff1':'#ffffff';ctx.stroke();
      ctx.fillStyle=win?'#06120a':'#ffffff';ctx.font='800 '+Math.max(8,R*1.25)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(LET[o.i],qs[0],qs[1]+R*0.06);
      ctx.restore();
    }
  }

  /* машина (вид сзади) */
  var cq=pr(cx_,0,carZ);
  if(cq){
    var s=cq[2],bob=Math.sin(T*22)*0.025*s*(t<12?1:0.2),bx0=cq[0],by0=cq[1]+bob,sh=-hd*0.55;
    var brake=t>ZEND/V;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.ellipse(bx0,by0+0.05*s,1.35*s,0.28*s,0,0,6.3);ctx.fill();
    ctx.translate(bx0,by0);ctx.transform(1,0,sh,1,0,0);
    /* колёса */
    ctx.fillStyle='#07080b';fillRR(-1.2*s,-0.62*s,0.42*s,0.64*s,0.1*s,'#07080b');fillRR(0.78*s,-0.62*s,0.42*s,0.64*s,0.1*s,'#07080b');
    /* кузов */
    var cg=ctx.createLinearGradient(0,-1.2*s,0,0);cg.addColorStop(0,sk.car);cg.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.fillStyle=sk.car;fillRR(-1.12*s,-0.95*s,2.24*s,0.78*s,0.2*s,sk.car);ctx.fillStyle=cg;rr(-1.12*s,-0.95*s,2.24*s,0.78*s,0.2*s);ctx.fill();
    /* кабина и заднее стекло */
    ctx.fillStyle=sk.car;ctx.beginPath();ctx.moveTo(-0.95*s,-0.9*s);ctx.lineTo(-0.7*s,-1.42*s);ctx.lineTo(0.7*s,-1.42*s);ctx.lineTo(0.95*s,-0.9*s);ctx.closePath();ctx.fill();
    ctx.fillStyle='#0a1018';ctx.beginPath();ctx.moveTo(-0.8*s,-0.95*s);ctx.lineTo(-0.58*s,-1.34*s);ctx.lineTo(0.58*s,-1.34*s);ctx.lineTo(0.8*s,-0.95*s);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.12)';ctx.beginPath();ctx.moveTo(-0.6*s,-1.3*s);ctx.lineTo(-0.2*s,-1.3*s);ctx.lineTo(-0.4*s,-0.98*s);ctx.lineTo(-0.72*s,-0.98*s);ctx.closePath();ctx.fill();
    /* спойлер */
    ctx.fillStyle='#0b0e14';ctx.fillRect(-1.0*s,-1.1*s,2.0*s,0.1*s);
    /* задние фонари */
    ctx.shadowColor='#ff3030';ctx.shadowBlur=(brake?26:14);ctx.fillStyle=brake?'#ff6a5a':'#ff2a2a';
    fillRR(-1.02*s,-0.78*s,0.55*s,0.15*s,0.05*s,ctx.fillStyle);fillRR(0.47*s,-0.78*s,0.55*s,0.15*s,0.05*s,ctx.fillStyle);ctx.shadowBlur=0;
    /* номер */
    fillRR(-0.38*s,-0.5*s,0.76*s,0.2*s,0.04*s,'#e9edf3');ctx.fillStyle='#10131a';ctx.font='700 '+(0.14*s)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('COIN',0,-0.4*s);
    ctx.restore();
  }
  /* дымка по краям */
  var vg=ctx.createRadialGradient(W/2,H*0.55,H*0.3,W/2,H*0.55,H*0.78);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.5)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(reveal){var fl=Math.max(0,1-(t-TCHOOSE)/0.3);if(fl>0){ctx.save();ctx.globalAlpha=0.18*fl;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.restore();}}

  /* верхняя панель и отсчёт */
  var l1,l2=null,c1='#ffffff';
  if(reveal){l1=tx.ans+' '+LET[sc.outcome];c1=UPC;}else{l1=tx.q;l2=tx.hint;}
  fillRR(30,104,480,92,18,'rgba(8,11,16,0.88)');ctx.lineWidth=2;ctx.strokeStyle=sk.accent;rr(30,104,480,92,18);ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(l2===null){fitText(l1,'800',44,440);ctx.fillStyle=c1;ctx.fillText(l1,270,150);}
  else{fitText(l1,'800',36,440);ctx.fillStyle=c1;ctx.fillText(l1,270,141);fitText(l2,'600',22,440);ctx.fillStyle=sk.accent;ctx.fillText(l2,270,177);}
  if(t<TCHOOSE){
    var n=Math.ceil(TCHOOSE-t),f=t%1;

}

             {f:660,at:ZEND/V,d:0.12},{f:990,at:ZEND/V+0.1,d:0.25}];

};
