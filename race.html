<body>
<button id="chtog" type="button"></button>

<script>
/* «Гонка»: 8 шариков падают сквозь трассу с препятствиями, зритель ставит на имя. Физика детерминирована (только + - * / sqrt, без sin/cos),
   поэтому одна и та же гонка получается у всех и при любом seed. Только запись роликов, дальше та же сцена пойдёт в живой эфир. */
(function(){
'use strict';
var W=540,H=960,LIVEMODE=new URLSearchParams(location.search).get('mode')!=='record',S=LIVEMODE?1:2;
var FONT='system-ui,"Segoe UI",Roboto,Arial,"Liberation Sans","DejaVu Sans",sans-serif';
var BRAND_RE=/^coinplay\.com(\/[A-Za-z0-9_-]{1,24})?$/;
var DT=CPRace.DT,WW=CPRace.WW,R=CPRace.R,LEN=CPRace.DEFLEN,SC=500/WW,CY0=500;
var COLORS=['#ff4d6d','#ffd23f','#3ddc97','#4cc9f0','#b388ff','#ff9f1c','#e8e8e8','#ff6ec7'];
var NOTES=[262,294,330,392,440,523,587,659];
var DEFNAMES=CPRace.DEFNAMES;
var TXT={
  en:{q:'Who wins the race?',hint:'Comment a name below',win:'Winner:'},
  ru:{q:'Кто победит в гонке?',hint:'Напиши имя в комментариях',win:'Победил:'},
  es:{q:'¿Quién gana la carrera?',hint:'Comenta un nombre',win:'Gana:'}
};
var RV=RaceVis,SKIN_NAMES=RV.THEME_NAMES;
function themeByName(n){var i=SKIN_NAMES.indexOf(n);return i>=0?RV.THEMES[i]:null;}
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W*S;cv.height=H*S;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function fillRR(x,y,w,h,r,c){ctx.fillStyle=c;rr(x,y,w,h,r);ctx.fill();}
function fitText(str,weight,maxSize,maxW){var s=maxSize;ctx.font=weight+' '+s+'px '+FONT;var w=ctx.measureText(str).width;if(w>maxW){s=Math.floor(s*maxW/w);ctx.font=weight+' '+s+'px '+FONT;}return s;}
function smooth(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
function clamp(x,a,b){return x<a?a:x>b?b:x;}
function bigText(str,x,y,size,alpha,fill){ctx.save();ctx.globalAlpha=alpha;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='800 '+size+'px '+FONT;ctx.lineWidth=size*0.14;ctx.strokeStyle='#05070a';ctx.lineJoin='round';ctx.strokeText(str,x,y);ctx.fillStyle=fill||'#ffffff';ctx.fillText(str,x,y);ctx.restore();}
function tri(x){x=x-Math.floor(x);return x<0.5?x*2:2-x*2;}

/* трасса, физика, анализ, характеры: см. racecore.js */
var C=CPRace;
var buildTrack=C.buildTrack,newSim=C.newSim,advance=C.advance,analyze=C.analyze,PERS=C.PERS,persOf=C.persOf,censor=C.censor,speechList=C.speechList,slx=C.slx;
/* ---------- сцена ---------- */
var scene=null,sim=null;
function rtOf(vt){var w=scene&&scene.warp,x=vt-scene.tstart;if(!w||x<w.a)return x;if(x<w.a+w.L/w.f)return w.a+(x-w.a)*w.f;return x-(w.L/w.f-w.L);}
function vtOf(rt){var w=scene&&scene.warp;if(!w||rt<w.a)return rt;if(rt<w.a+w.L)return w.a+(rt-w.a)/w.f;return rt+(w.L/w.f-w.L);}
function drawKnife(x,y,ang,L){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.lineJoin='round';ctx.fillStyle='#8a5a2b';ctx.strokeStyle='#0a0c10';ctx.lineWidth=2;ctx.beginPath();ctx.rect(-L*0.75,-L*0.13,L*0.45,L*0.26);ctx.fill();ctx.stroke();
  ctx.fillStyle='#e8eef5';ctx.beginPath();ctx.moveTo(-L*0.3,-L*0.2);ctx.lineTo(L*0.6,-L*0.12);ctx.lineTo(L*0.9,L*0.08);ctx.lineTo(-L*0.3,L*0.2);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
function drawMarble(m,px,py,sc_,col,name,isLead,rt,sim_,dead,chi){
  var r=R*SC*sc_,sp=Math.sqrt(m.vx*m.vx+m.vy*m.vy),lx=sp>1?m.vx/sp:0,ly_=sp>1?m.vy/sp:1;
  var top=RV.drawChar(ctx,chi,px,py,r,{col:col,lx:lx,ly:ly_,vx:m.vx,vy:m.vy,t:rt,dead:dead});
  if(isLead){var cy=py-r*Math.max(1.05,top-.02),k=top>1.3?.8:1;ctx.save();ctx.translate(px,cy);ctx.scale(k,k);ctx.fillStyle='#ffd23f';ctx.strokeStyle='#0a0c10';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(-r*0.6,0);ctx.lineTo(-r*0.6,-r*0.6);ctx.lineTo(-r*0.25,-r*0.3);ctx.lineTo(0,-r*0.75);ctx.lineTo(r*0.25,-r*0.3);ctx.lineTo(r*0.6,-r*0.6);ctx.lineTo(r*0.6,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
  /* имя на плашке цвета слота: читается на любом фоне */
  ctx.save();ctx.font='800 15px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';var nw=ctx.measureText(name).width+14,ny=py+r+13;
  fillRR(px-nw/2,ny-10,nw,20,10,'rgba(8,11,16,0.82)');ctx.lineWidth=2;ctx.strokeStyle=col;rr(px-nw/2,ny-10,nw,20,10);ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(name,px,ny+1);ctx.restore();
}

function drawSpeech(rt,sim_){
  var list=scene.speech,k,n=0;
  for(k=list.length-1;k>=0&&n<3;k--){
    var sp=list[k],age=rt-sp.t;if(age<0||age>1.05)continue;n++;
    var m=sim_.ms[sp.id],px=20+(m.x/WW)*(W-40),py=CY0+(m.y-sim_.camY)*SC;
    var pop=Math.min(1,age/0.12),fade=age>0.8?1-(age-0.8)/0.25:1,sc_=0.4+0.6*pop+(age<0.12?0.15:0);
    ctx.save();ctx.globalAlpha=fade;ctx.font='800 15px '+FONT;
    var w=ctx.measureText(sp.text).width+20,bx=clamp(px,w/2+24,W-w/2-24),by=Math.max(232,py-R*SC-30);
    ctx.translate(bx,by);ctx.scale(sc_,sc_);
    ctx.fillStyle=sp.kind==='lose'?'#fff3f3':'#fffbe6';ctx.strokeStyle='#0a0c10';ctx.lineWidth=2.5;
    rr(-w/2,-14,w,28,10);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(clamp(px-bx,-w/2+12,w/2-12)-6,13);ctx.lineTo(clamp(px-bx,-w/2+12,w/2-12),22);ctx.lineTo(clamp(px-bx,-w/2+12,w/2-12)+6,13);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle=sp.kind==='lose'?'#c1121f':'#10131a';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(sp.text,0,1);
    ctx.restore();
    if(sp.kind==='lose'){ctx.strokeStyle='#0a0c10';ctx.lineWidth=2.4;ctx.lineCap='round';var r_=R*SC;ctx.beginPath();ctx.moveTo(px-r_*0.7,py-r_*0.62);ctx.lineTo(px-r_*0.12,py-r_*0.42);ctx.moveTo(px+r_*0.7,py-r_*0.62);ctx.lineTo(px+r_*0.12,py-r_*0.42);ctx.stroke();}
  }
}
function draw(t){
  var sc=scene,sk=sc.theme,tx=TXT[sc.lang]||TXT.en,rt=Math.max(0,rtOf(t)),i,k;
  if(!sim||sim.t>rt+1e-6+DT){sim=newSim(sc.simSeed,sc.deg);}
  advance(sim,rt);
  var camY=sim.camY;
  var done=sim.finN>0,wf=sc.win,winT=sc.tf,since=done?Math.max(0,rt-winT):0;
  /* тряска от ударов и старта */
  var shx=0,shy=0,j;
  for(j=sim.ev.length-1;j>=0&&j>sim.ev.length-12;j--){var ev=sim.ev[j],age=rt-ev.t;if(age<0.2){var a_=Math.min(1,ev.mag/320)*(1-age/0.2)*2.2;shx+=Math.sin(rt*97+j*3)*a_;shy+=Math.cos(rt*83+j*5)*a_;}}
  var sa=t>=sc.tstart&&t<sc.tstart+0.4?(1-(t-sc.tstart)/0.4)*5:0;shx+=Math.sin(t*90)*sa;shy+=Math.cos(t*77)*sa;
  ctx.setTransform(S,0,0,S,0,0);ctx.clearRect(0,0,W,H);
  RV.paintBg(ctx,sk,{W:W,H:H,camY:camY,SC:SC,LEN:LEN,t:sc.live?performance.now()/1000:t,seed:sc.seed});
  ctx.save();ctx.translate(shx,shy);
  function X(x){return 20+(x/WW)*(W-40);}
  var xs=SC;
  function Y(y){return CY0+(y-camY)*SC;}
  /* трасса: полотно */
  fillRR(18,200,W-36,640,8,'rgba(4,6,10,'+(0.12+sk.dim*0.9)+')');ctx.lineWidth=2;ctx.strokeStyle=sk.acc;ctx.globalAlpha=0.35;rr(18,200,W-36,640,8);ctx.stroke();ctx.globalAlpha=1;
  ctx.save();ctx.beginPath();ctx.rect(14,205,W-28,630);ctx.clip();
  var zw=sc.warp,zz=1;
  if(zw){var zl=0;for(k=1;k<8;k++){if(!sim.ms[k].dead&&(sim.ms[zl].dead||sim.ms[k].y>sim.ms[zl].y))zl=k;}
    zz=1+0.24*smooth((rt-zw.a)/0.35)*(1-smooth((rt-(zw.a+zw.L+0.5))/0.7));
    if(zz>1.001){var zcx=X(sim.ms[zl].x),zcy=Y(sim.ms[zl].y);ctx.translate(zcx,zcy);ctx.scale(zz,zz);ctx.translate(-zcx,-zcy);}}
  /* крупная печать адреса на сукне: попадается в кадр один раз, пока шарики проезжают мимо */
  if(!sc.live){var dyw=LEN*(0.4+0.2*(((sc.simSeed*2654435761)>>>0)/4294967296)),dyy=Y(dyw);if(dyy>120&&dyy<950){ctx.save();ctx.translate(W/2,dyy);ctx.rotate(-0.06);ctx.textAlign='center';ctx.textBaseline='middle';fitText(sc.url,'900',84,440);ctx.fillStyle='rgba(255,255,255,0.13)';ctx.fillText(sc.url,0,0);ctx.lineWidth=2.5;ctx.strokeStyle=sk.acc;ctx.globalAlpha=0.45;ctx.strokeText(sc.url,0,0);ctx.restore();}}
  /* линии каждые 100 */
  ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;for(var ly=Math.floor((camY-200)/100)*100;ly<camY+400;ly+=100){ctx.beginPath();ctx.moveTo(20,Y(ly));ctx.lineTo(W-20,Y(ly));ctx.stroke();}
  /* препятствия */
  ctx.lineCap='round';
  for(k=0;k<sim.tr.segs.length;k++){var s_=sim.tr.segs[k];if(Y(s_.y1)<150&&Y(s_.y2)<150||Y(s_.y1)>900&&Y(s_.y2)>900)continue;
    ctx.lineWidth=5*SC+4;ctx.strokeStyle='#0a0c10';ctx.beginPath();ctx.moveTo(X(s_.x1),Y(s_.y1));ctx.lineTo(X(s_.x2),Y(s_.y2));ctx.stroke();
    ctx.lineWidth=5*SC;ctx.strokeStyle=sk.acc;ctx.beginPath();ctx.moveTo(X(s_.x1),Y(s_.y1));ctx.lineTo(X(s_.x2),Y(s_.y2));ctx.stroke();}
  for(k=0;k<sim.tr.sl.length;k++){var q=sim.tr.sl[k],qy=Y(q.y);if(qy<150||qy>900)continue;var cx2=slx(q,rt<0?0:sim.t);
    ctx.lineWidth=q.th*2*SC+4;ctx.strokeStyle='#0a0c10';ctx.beginPath();ctx.moveTo(X(cx2-q.len),qy);ctx.lineTo(X(cx2+q.len),qy);ctx.stroke();
    ctx.lineWidth=q.th*2*SC;ctx.strokeStyle='#ff4d6d';ctx.beginPath();ctx.moveTo(X(cx2-q.len),qy);ctx.lineTo(X(cx2+q.len),qy);ctx.stroke();}
  for(k=0;k<sim.tr.pegs.length;k++){var p=sim.tr.pegs[k],py=Y(p.y);if(py<150||py>900)continue;var pr=p.r*SC;
    if(p.b){ctx.save();ctx.shadowColor=sk.acc;ctx.shadowBlur=14;ctx.fillStyle='#10141b';ctx.beginPath();ctx.arc(X(p.x),py,pr,0,6.3);ctx.fill();ctx.restore();ctx.lineWidth=3.2;ctx.strokeStyle=sk.acc;ctx.beginPath();ctx.arc(X(p.x),py,pr,0,6.3);ctx.stroke();}
    else{ctx.fillStyle='#e9edf3';ctx.beginPath();ctx.arc(X(p.x),py,pr,0,6.3);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#0a0c10';ctx.stroke();}}
  for(k=0;k<sim.tr.knives.length;k++){var kn=sim.tr.knives[k],kyy=Y(kn.y);if(sim.kt[k]||kyy<150||kyy>900)continue;
    ctx.save();ctx.shadowColor='#ff4d6d';ctx.shadowBlur=16;ctx.fillStyle='rgba(255,77,109,0.22)';ctx.beginPath();ctx.arc(X(kn.x),kyy,R*SC*0.9,0,6.3);ctx.fill();ctx.restore();drawKnife(X(kn.x),kyy,-0.8+Math.sin(t*5)*0.25,R*SC*0.95);}
  for(k=0;k<sim.tr.zones.length;k++){var zn=sim.tr.zones[k],zy=Y(zn.y);if(zy<130||zy>920)continue;var zh=zn.h*xs;
    if(zn.k==='belt'){ctx.fillStyle='rgba(76,201,240,0.16)';ctx.fillRect(20,zy-zh/2,W-40,zh);ctx.strokeStyle='#4cc9f0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(20,zy-zh/2);ctx.lineTo(W-20,zy-zh/2);ctx.moveTo(20,zy+zh/2);ctx.lineTo(W-20,zy+zh/2);ctx.stroke();
      ctx.fillStyle='#4cc9f0';ctx.font='800 20px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';var off=((t*60)%48)*zn.dir;for(var ci=-1;ci<12;ci++)ctx.fillText(zn.dir>0?'›':'‹',20+ci*48+off+24,zy+1);}
    else{ctx.fillStyle='rgba(139,94,52,0.38)';ctx.fillRect(20,zy-zh/2,W-40,zh);ctx.strokeStyle='rgba(139,94,52,0.9)';ctx.lineWidth=2;ctx.strokeRect(20,zy-zh/2,W-40,zh);ctx.fillStyle='rgba(180,130,80,0.6)';for(var bi=0;bi<8;bi++){ctx.beginPath();ctx.arc(40+bi*62+((bi*37)%17),zy+((bi*53)%11)-5,3+(bi%3),0,6.3);ctx.fill();}}}

    onSkew:function(ms){skew=ms/1000;},
    onState:function(s){serverMode=!!(s.on);if(!serverMode)scoreEl.textContent='';},
    onMsg:function(d){if(d.t==='welcome'){tog.classList.add('on');applyChat();}else if(d.t==='msg'&&chatOff){unread++;paintTog();}onMsg(d);},
    onPick:function(d){if(cur.names&&d>=1&&d<=8&&pick<0){pick=d-1;if(scene)scene.pick=pick;paintBtns();}},
    onResult:function(d){RES=d;RES.n=cur.n;statusEl.textContent=d.win?'You called it, +'+d.pts+' pts':'Missed. Winner: '+d.outcome;track('result',{win:d.win,pts:d.pts});},
    onMe:function(d){hs.textContent='★ '+d.pts+(d.rank?' · #'+d.rank:'');scoreEl.textContent='★ '+d.pts+' · '+d.w+'/'+d.n+(d.streak>1?' · 🔥'+d.streak:'')+(d.rank?' · #'+d.rank:'');}});
  layout();
  var firstAt=Date.now();
  (function frame(){
    var T=nowT(),n=Math.floor(T/CYC),u=T-n*CYC;
    if(n!==cur.n){newCycle(n);firstAt=Date.now();}
    if(!cur.names&&!serverMode&&Date.now()-firstAt>1500)fallbackPlan(n);
    if(!cur.names&&serverMode&&Date.now()-firstAt>6000)fallbackPlan(n);   /* сервер молчит: не оставляем пустой экран */
    if(scene&&scene.live){
      var ui,tt=u-(START-TSTART),fin=TSTART+scene.tf;
      var secs=Math.max(0,Math.ceil(LOCK-u));
      if(u<LOCK)ui={l1:pick>=0?'Your bet: '+cur.names[pick]:'Pick a racer',l2:'Bets close in '+secs+'s'};
      else if(u<START)ui={l1:pick>=0?'Your bet: '+cur.names[pick]:'Bets closed',l2:'Race starts now'};
      else if(tt<fin)ui={l1:pick>=0?'Your bet: '+cur.names[pick]:'Race on',l2:'Type any word to name a racer in the next race'};
      else ui={l1:'Winner: '+scene.names[scene.win],c1:COLORS[scene.win],l2:'Next race in '+Math.max(0,Math.ceil(CYC-u))+'s'};
      scene.ui=ui;scene.pick=pick;scene.noPanel=compact;
      if(scene.provisional&&u>=LOCK&&serverMode)ui.l1='Locking…';
      draw(Math.min(tt,fin+2.2));
      if(compact&&scene.hdr){h1.textContent=scene.hdr.l1;h1.style.color=scene.hdr.c1;h2.textContent=(u>=START+fin&&RES&&RES.n===cur.n)?(RES.win?'You called it, +'+RES.pts+' pts':'Missed. Winner: '+RES.outcome):(scene.hdr.l2||'');}
      if(sim)for(var bi=0;bi<8;bi++)btns[bi].classList.toggle('dead',sim.t>0.2&&!!sim.ms[bi].dead);
      if(u<LOCK&&btns[0].disabled&&pick<0&&cur.names)paintBtns();
      if(u>=LOCK&&!btns[0].disabled)paintBtns();
    }else{cv.getContext('2d').fillStyle='#000';}
    requestAnimationFrame(frame);
  })();
}
if(LIVEMODE)startLive();
})();
</script>
